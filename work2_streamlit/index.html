<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JN Apartment Builder</title>
<meta name="build" content="18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: full-screen 3D viewport, one floating panel top-left, view buttons bottom-centre. */
  color-scheme: light;
  --paper: #e7e1d8;
  --panel: #fbfcfd;
  --ink: #1d2730;
  --muted: #5d6b77;
  --line: #cfd7dd;
  --accent: #0b6fa4;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
/* Photoreal view: its own canvas on top of the plan view. Pointer input still goes to #stage. */
#photo { position: fixed; inset: 0; pointer-events: none; background: #cfdcea; }
#photo[hidden] { display: none; }
#photo canvas { display: block; width: 100%; height: 100%; }
.dim, .tag {
  position: absolute; left: 0; top: 0;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  will-change: transform;
}
.dim {
  font: 500 11px/1 var(--font-mono);
  padding: 3px 5px;
  border-radius: 3px;
  background: var(--panel);
  border: 1px solid var(--accent);
  color: var(--accent);
}
.tag {
  font: 600 11px/1.35 var(--font-body);
  letter-spacing: .04em; text-transform: uppercase; text-align: center;
  color: var(--ink);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
}
.tag small {
  display: block;
  font: 500 10px/1.2 var(--font-mono);
  letter-spacing: 0; text-transform: none;
}
body.no-dims .dim { display: none; }

.panel {
  position: fixed; left: 16px; top: 16px;
  width: min(290px, calc(100vw - 32px));
  max-height: calc(100% - 96px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px 12px;
  box-shadow: 0 6px 20px rgba(29, 39, 48, .10);
}
.panel[hidden] { display: none; }
.panel h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.panel p { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
.panel th { text-align: left; font-weight: 500; padding: 4px 0; }
.panel td {
  text-align: right; padding: 4px 0 4px 8px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted);
}
.panel tr + tr th, .panel tr + tr td { border-top: 1px solid var(--line); }
.panel .note { margin: 8px 0 0; font-size: 11px; }
.panel summary { cursor: pointer; font-size: 12px; font-weight: 500; list-style-position: inside; }
.panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 32px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px;
  box-shadow: 0 6px 20px rgba(29, 39, 48, .10);
}
.bar button {
  font: 500 12px/1 var(--font-body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 12px;
  cursor: pointer;
}
.bar button:hover { border-color: var(--ink); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
body.walk #labels, body.walk .panel { display: none; }
.hint {
  display: none;
  position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; color: var(--ink); text-align: center;
  box-shadow: 0 6px 20px rgba(29, 39, 48, .10);
}
body.walk .hint { display: block; }
.pad {
  position: fixed; right: 16px; bottom: 84px;
  display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px;
}
.pad[hidden] { display: none; }
.pad button {
  font: 500 16px/1 var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.pad button:active { background: var(--ink); color: var(--panel); }
.pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.paint {
  position: fixed; left: 0; top: 0; width: 200px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px 12px; font-size: 12px; color: var(--ink);
  box-shadow: 0 8px 24px rgba(29, 39, 48, .22);
}
.paint[hidden] { display: none; }
.paint-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.paint-head strong { font-weight: 600; }
.paint button { font: 500 12px/1 var(--font-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; cursor: pointer; }
.paint button:hover { border-color: var(--ink); }
.paint button:focus-visible, .paint input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.paint canvas { display: block; margin: 0 auto 8px; cursor: crosshair; touch-action: none; border-radius: 50%; }
.paint label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; color: var(--muted); }
.paint input[type="range"] { flex: 1; min-width: 0; }
.paint input[type="text"] { width: 96px; font: 500 12px/1 var(--font-mono); padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff; }
.paint input[type="number"] { width: 78px; font: 500 12px/1 var(--font-mono); padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff; }
.paint p { margin: 0; font-size: 11px; color: var(--muted); }
#sizeBox { left: auto; right: 16px; top: 16px; }
.panel .reset { margin-top: 10px; font: 500 12px/1 var(--font-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; }
.panel .reset:hover { border-color: var(--ink); }
.panel .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.paint .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
.paint .swatches button { height: 24px; padding: 0; border-color: rgba(29, 39, 48, .25); }
.rot {
  position: fixed; left: 0; top: 0;
  width: 36px; height: 36px; padding: 0;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 2px solid var(--panel);
  background: var(--accent);
  color: var(--panel);
  box-shadow: 0 3px 10px rgba(29, 39, 48, .30);
  cursor: grab; touch-action: none;
  will-change: transform;
}
.rot:active { cursor: grabbing; }
.rot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rot[hidden] { display: none; }
#error {
  position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
  font-size: 14px; color: var(--ink);
}
@media (max-width: 520px) {
  .panel { padding: 10px 12px; }
  .dim { font-size: 10px; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="photo" hidden></div>

<div class="bar" role="group" aria-label="View">
  <button type="button" id="v3d" aria-pressed="true">3D view</button>
  <button type="button" id="vtop" aria-pressed="false">Top view</button>
  <button type="button" id="vwalls" aria-pressed="false">Full-height walls</button>
  <button type="button" id="vdims" aria-pressed="true">Measures</button>
  <button type="button" id="vphoto" aria-pressed="false">Walkaround</button>
  <button type="button" id="resetAll" title="Put furniture, bed size and wall colours back to the start">Reset</button>
</div>

<div class="hint" id="hint"></div>
<div class="pad" id="pad" role="group" aria-label="Walk" hidden>
  <button type="button" data-key="ArrowUp" aria-label="Forward" style="grid-column: 2; grid-row: 1">▲</button>
  <button type="button" data-key="ArrowLeft" aria-label="Turn left" style="grid-column: 1; grid-row: 2">◀</button>
  <button type="button" data-key="ArrowDown" aria-label="Back" style="grid-column: 2; grid-row: 2">▼</button>
  <button type="button" data-key="ArrowRight" aria-label="Turn right" style="grid-column: 3; grid-row: 2">▶</button>
</div>

<button type="button" class="rot" id="rotHandle" aria-label="Rotate: drag around the piece" title="Drag to rotate" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
</button>

<div class="paint" id="paint" role="dialog" aria-label="Wall colour" hidden>
  <div class="paint-head"><strong id="paintTitle">Wall colour</strong><button type="button" id="paintClose" aria-label="Close">✕</button></div>
  <canvas id="paintWheel" width="160" height="160" aria-label="Colour wheel: drag to pick hue and strength"></canvas>
  <label>Brightness <input type="range" id="paintVal" min="5" max="100" value="100"></label>
  <label>Hex code <input type="text" id="paintHex" maxlength="7" spellcheck="false" autocomplete="off"></label>
  <div class="swatches" id="paintSw" role="group" aria-label="Ready-made colours"></div>
  <button type="button" id="paintReset">Back to the original colour</button>
</div>

<div class="paint" id="sizeBox" role="dialog" aria-label="Bed size" hidden>
  <div class="paint-head"><strong>Bed size in cm</strong><button type="button" id="sizeClose" aria-label="Close">✕</button></div>
  <label>Width <input type="number" id="bedW" min="70" max="240" step="1" inputmode="numeric"></label>
  <label>Length <input type="number" id="bedL" min="160" max="240" step="1" inputmode="numeric"></label>
  <label>Height <input type="number" id="bedH" min="20" max="80" step="1" inputmode="numeric"></label>
  <p>Type a number and press Enter. Height is the top of the mattress.</p>
</div>

<div id="error">The 3D library could not load. Check your connection and reload the page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) { document.getElementById('error').style.display = 'grid'; return; }

  // =====================================================================
  // Apartment data. All values in cm, in plan orientation:
  // x runs left to right, z runs top to bottom (Wintergarten at the top).
  // Origin = top-left inside corner of Zimmer 2.
  // =====================================================================
  var H = 240;          // room height (assumed)
  var DOOR_H = 200, SILL = 90, WIN_H = 130;   // assumed

  // Interior footprints. w and l are the measured values from the plan.
  var rooms = [
    { name: 'Zimmer 2',     x0: 0,   z0: 0,    w: 272, l: 409, area: '11.0', color: 0xe6cf95 },
    { name: 'Zimmer 1',     x0: 282, z0: 0,    w: 336, l: 409, area: '13.5', color: 0xe6cf95 },
    { name: 'Flur',         x0: 135, z0: -188, w: 147, l: 178, area: '2.5',  color: 0xbcd6a8 },
    { name: 'Bad',          x0: 135, z0: -459, w: 147, l: 263, area: '3.5',  color: 0xcfe3ea },
    { name: 'Wohnküche',    x0: 291, z0: -459, w: 327, l: 449, area: '14.5', color: 0xcfe3ea },
    { name: 'Wintergarten', x0: 465, z0: -728, w: 153, l: 229, area: '2.0',  color: 0xe6cf95 }
  ];

  // Walls as plan rectangles (x0, z0, x1, z1). Openings are given along the
  // wall's long axis in the same coordinates.
  var walls = [];
  function wall(x0, z0, x1, z1, openings) {
    walls.push({ x0: x0, z0: z0, x1: x1, z1: z1, op: openings || [] });
  }
  function door(from, to) { return { from: from, to: to, type: 'door' }; }
  function win(from, to) { return { from: from, to: to, type: 'window' }; }

  wall(-30, 409, 648, 439, [win(46, 213), win(327, 575)]);      // outer wall, Zimmer 2 + Zimmer 1 windows
  wall(-30, -40, 0, 409);                                        // outer wall left of Zimmer 2
  wall(0, -40, 105, 0);                                          // outer wall above Zimmer 2 (stairwell side)
  wall(105, -499, 135, 0, [door(-135, -45)]);                    // outer wall left of Flur + Bad, entrance
  wall(135, -10, 618, 0, [door(142, 222), door(468, 548)]);      // Flur > Zimmer 2, Wohnküche > Zimmer 1
  wall(272, 0, 282, 409);                                        // Zimmer 2 | Zimmer 1
  wall(618, -758, 648, 409);                                     // outer wall right
  wall(135, -196, 282, -188, [door(202, 272)]);                  // Flur > Bad
  wall(282, -487, 291, -10, [door(-155, -75)]);                  // Flur > Wohnküche
  // Window wall of Bad + Wohnküche: thin (12 cm) in the window recess, which lies
  // 28 cm beyond the 263 / 449 dimension line. Includes the door to the Wintergarten.
  wall(135, -499, 553, -487, [win(145, 217), win(300, 459), door(472, 552)]);
  wall(553, -499, 618, -459);                                    // full-depth wall right of the Wintergarten door
  wall(226, -487, 282, -436);                                    // shaft, Bad top right
  wall(291, -207, 351, -160);                                    // wall block below the stove
  wall(567, -45, 618, -10);                                      // notch, Wohnküche bottom right
  wall(455, -728, 465, -499, [win(-728, -499)]);                 // Wintergarten glazing, left
  wall(455, -738, 618, -728, [win(465, 618)]);                   // Wintergarten glazing, top

  // =====================================================================
  // Scene
  // =====================================================================
  var stage = document.getElementById('stage');
  var labelLayer = document.getElementById('labels');
  var css = getComputedStyle(document.documentElement);
  var col = function (name) { return new THREE.Color(css.getPropertyValue(name).trim()); };

  // ---------- Look: colours from the bedroom moodboard (warm sand, taupe, oak, dark brown) ----------
  // Colours are written as they should appear on screen (sRGB) and converted for the renderer.
  var LOOK = {
    wall: '#d9cbb7',        // warm sand plaster
    wallTop: '#3b2f27',     // cut wall tops, dark brown
    frame: '#f1ece4',       // window frames, warm white
    brass: '#b08d57',       // door thresholds
    ground: '#d6cec2',      // ground around the apartment
    woodTones: ['#9b7352', '#8a6446', '#a9805c', '#7a573c', '#b08862', '#946a48'],   // oak planks
    tile: [92, 80, 71],     // Bad: warm taupe stone tiles (RGB), grout below
    grout: '#b3a796'
  };
  function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  // Physically based material: colour as on screen, roughness 0 (mirror) to 1 (matt), metalness 0 or 1.
  function pbr(hex, rough, metal, extra) {
    var o = extra || {};
    o.color = lin(hex); o.roughness = rough; o.metalness = metal || 0;
    return new THREE.MeshStandardMaterial(o);
  }

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(col('--paper'));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  // Light: warm afternoon sun with soft shadows, a warm sky light, and a soft studio
  // environment for reflections. The environment is made here in code: nothing to download.
  var hemi = new THREE.HemisphereLight(0xfff1e0, 0x6b5643, 0.35);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffe4c4, 2.3);
  sun.position.set(4.5, 8, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
  sun.shadow.camera.far = 40;
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  scene.add(sun);
  (function () {
    var envScene = new THREE.Scene(), geo = new THREE.SphereGeometry(10, 32, 16), pos = geo.attributes.position, cols = [];
    var top = lin('#fff6ea'), mid = lin('#e8dccb'), bottom = lin('#6e5a48');
    for (var i = 0; i < pos.count; i++) {
      var y = pos.getY(i) / 10, c = y > 0 ? mid.clone().lerp(top, y) : mid.clone().lerp(bottom, -y);
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(envScene, 0.04).texture;
    pm.dispose();
  })();

  // Everything is authored in cm inside "root", which is scaled to metres and centred.
  var root = new THREE.Group();
  root.scale.set(0.01, 0.01, 0.01);
  root.position.set(-3.09, 0, 1.6);
  scene.add(root);

  var sideMat = pbr(LOOK.wall, 0.92);
  var topMat = pbr(LOOK.wallTop, 0.85);
  var wallMats = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];
  var glassMat = pbr('#cfe1e8', 0.05, 0, { transparent: true, opacity: 0.28, depthWrite: false });
  var sillMat = pbr(LOOK.brass, 0.35, 1);
  var frameMat = pbr(LOOK.frame, 0.45);

  function box(parent, x0, y0, z0, x1, y1, z1, mat, shadow) {
    if (x1 - x0 <= 0 || y1 - y0 <= 0 || z1 - z0 <= 0) return;
    var m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    m.castShadow = shadow !== false;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  // ---------- Floors ----------
  // Oak planks everywhere, warm stone tiles in the Bad. The texture coordinates follow
  // real positions, so planks and tiles run on from room to room at their true size.
  // The planks start as a drawn texture and switch to a photo texture once it has loaded.
  var WOOD_SIZE = 220, TILE_SIZE = 240;     // cm covered by one repeat of the texture
  var woodMat = new THREE.MeshStandardMaterial({ map: canvasTexture(1024, drawWood, true), roughness: 0.55 });
  var tileMat = new THREE.MeshStandardMaterial({
    map: canvasTexture(2048, function (g, n) { drawTiles(g, n, false); }, true),
    bumpMap: canvasTexture(1024, function (g, n) { drawTiles(g, n, true); }, false), bumpScale: 0.004,
    roughness: 0.4
  });
  woodMat.map.anisotropy = tileMat.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  function floorPlane(parent, x0, z0, x1, z1, material, period) {
    var geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
    var pos = geo.attributes.position, uv = geo.attributes.uv, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    for (var i = 0; i < pos.count; i++) uv.setXY(i, (cx + pos.getX(i)) / period, (cz - pos.getY(i)) / period);
    var m = new THREE.Mesh(geo, material);
    m.rotation.x = -Math.PI / 2;
    m.position.set(cx, 0, cz);
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  function isTiled(name) { return name === 'Bad'; }
  rooms.forEach(function (r) {
    r.x1 = r.x0 + r.w; r.z1 = r.z0 + r.l;
    if (isTiled(r.name)) floorPlane(root, r.x0, r.z0, r.x1, r.z1, tileMat, TILE_SIZE);
    else floorPlane(root, r.x0, r.z0, r.x1, r.z1, woodMat, WOOD_SIZE);
  });
  // Window recess floors (Bad, Wohnküche), outside the measured rectangles.
  floorPlane(root, 135, -487, 282, -459, tileMat, TILE_SIZE);
  floorPlane(root, 291, -487, 553, -459, woodMat, WOOD_SIZE);
  // Ground around the apartment, a little lower, so the building throws a shadow.
  var ground = floorPlane(root, -500, -1300, 1100, 1000, pbr(LOOK.ground, 0.95), 100);
  ground.position.y = -1;

  // ---------- Movable items ----------
  // Each item is a group whose origin is the centre of its footprint, so it turns
  // on the spot. Parts are still written in apartment coordinates: they go into an
  // inner group that is shifted back by the centre.
  var items = [], cur = root, woman = null, womanFace = 0.5;
  // hw and hd are half the footprint width (x) and depth (z), used for snapping to walls.
  // Fixed items cannot be selected, moved or turned.
  function startItem(name, cx, cz, hw, hd, fixed) {
    var g = new THREE.Group();
    g.position.set(cx, 0, cz);
    g.userData.item = { name: name, turns: 0, hw: hw, hd: hd, fixed: !!fixed };
    var inner = new THREE.Group();
    inner.position.set(-cx, 0, -cz);
    g.add(inner);
    root.add(g);
    items.push(g);
    cur = inner;
    return g;
  }
  function endItem() { cur = root; }

  // ---------- Bad fixtures, start positions scaled from the plan drawing ----------
  var white = pbr('#f6f4f0', 0.12);          // glazed ceramic
  var basinMat = pbr('#e9e6e1', 0.06);

  // Bathtub 70 x 160, rim height 57 (size estimated), left wall, 16 cm below the window wall.
  var TUB = { x0: 135, z0: -471, w: 70, l: 160, h: 57 };
  startItem('bathtub', TUB.x0 + TUB.w / 2, TUB.z0 + TUB.l / 2, TUB.w / 2, TUB.l / 2, true);
  box(cur, TUB.x0, 0, TUB.z0, TUB.x0 + TUB.w, TUB.h, TUB.z0 + TUB.l, white);

      for (var c = -1; c < 4; c++) {
        var v = Math.floor(Math.random() * 12) - 6, t = LOOK.tile;
        g.fillStyle = bump ? '#fff' : 'rgb(' + (t[0] + v) + ',' + (t[1] + v) + ',' + (t[2] + v) + ')';
        g.fillRect((c + (r % 2) * 0.5) * w + gap, r * h + gap, w - 2 * gap, h - 2 * gap);
      }
    }
    if (bump) return;
    for (var i = 0; i < 5000; i++) {       // fine speckle
      g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '255,255,255' : '0,0,0') + ', .035)';
      g.fillRect(Math.random() * n, Math.random() * n, 2 + Math.random() * 5, 2 + Math.random() * 5);
    }
  }

  function initPhoto() {
    P = { total: 0, done: 0, mixer: null, womanModel: null, womanScale: 1, pbr: {}, paint: {} };
    var r = P.renderer = new THREE.WebGLRenderer({ antialias: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.0;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.shadowMap.autoUpdate = false;        // the scene is static: shadows are drawn only when something changes
    photoLayer.appendChild(r.domElement);

    P.scene = new THREE.Scene();
    P.scene.background = new THREE.Color(0xcfdcea);
    P.camera = new THREE.PerspectiveCamera(72, 1, 0.05, 500);
    P.camera.rotation.order = 'YXZ';
    P.root = new THREE.Group();
    P.root.scale.copy(root.scale);
    P.root.position.copy(root.position);
    P.scene.add(P.root);

    // Light. Until the HDR sky has loaded, a soft sky light stands in for it.
    P.hemi = new THREE.HemisphereLight(0xfff3e4, 0xd9c8b2, 0.8);    // warm fill, stands for light bouncing off walls and floor
    P.scene.add(P.hemi);
    var sun = P.sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
    sun.position.set(2.5, 6, 8);           // low sun from the Zimmer window side
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
    sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
    sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    P.scene.add(sun);

    // Materials
    function std(o) { o.envMapIntensity = o.envMapIntensity || PHOTO.env; return new THREE.MeshStandardMaterial(o); }
    var M = P.mat = {
      wood: std({ map: canvasTexture(1024, drawWood, true), roughness: 0.55, envMapIntensity: PHOTO.envFloor }),
      tile: std({
        map: canvasTexture(2048, function (g, n) { drawTiles(g, n, false); }, true),
        bumpMap: canvasTexture(1024, function (g, n) { drawTiles(g, n, true); }, false), bumpScale: 0.004,
        roughness: 0.55, envMapIntensity: 0.25
      }),
      wall: std({ color: lin(LOOK.wall), roughness: 0.92 }),
      ceiling: std({ color: 0xffffff, roughness: 0.96 }),
      frame: std({ color: lin(LOOK.frame), roughness: 0.4 }),
      brass: std({ color: lin(LOOK.brass), metalness: 1, roughness: 0.32, envMapIntensity: 1 }),
      chrome: std({ color: 0xd9dde0, metalness: 1, roughness: 0.14, envMapIntensity: 1 }),
      ceramic: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.8 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, transparent: true, opacity: 0.12, depthWrite: false, envMapIntensity: 1.2 })
    };

    // Floors. Texture coordinates follow real positions, so planks and tiles run on
    // from room to room at their true size.
    function floor(x0, z0, x1, z1, mat, period) {
      var geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
      var pos = geo.attributes.position, uv = geo.attributes.uv, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
      for (var i = 0; i < pos.count; i++) uv.setXY(i, (cx + pos.getX(i)) / period, (cz - pos.getY(i)) / period);
      var m = new THREE.Mesh(geo, mat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(cx, 0, cz);
      m.receiveShadow = true;
      P.root.add(m);
    }
    var tiled = { 'Bad': 1 };
    rooms.forEach(function (rm) {
      if (tiled[rm.name]) floor(rm.x0, rm.z0, rm.x1, rm.z1, M.tile, PHOTO.tileSize);
      else floor(rm.x0, rm.z0, rm.x1, rm.z1, M.wood, PHOTO.woodSize);
    });
    floor(135, -487, 282, -459, M.tile, PHOTO.tileSize);     // window recess, Bad
    floor(291, -487, 553, -459, M.wood, PHOTO.woodSize);     // window recess, Wohnküche

    // Ceiling: faces down, lets no sun in from above.
    var ceil = new THREE.Mesh(new THREE.PlaneGeometry(678, 1197), M.ceiling);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.set(309, H, -159.5);
    ceil.castShadow = true;
    P.root.add(ceil);

    // Walls and windows from the same wall list as plan mode. Door thresholds are brass strips.
    P.walls = new THREE.Group(); P.windows = new THREE.Group();
    buildWalls(P.walls, P.windows, { side: M.wall, top: M.wall, glass: M.glass, frame: M.frame, sill: M.brass });
    box(P.walls, 116, 0.6, -135, 122, DOOR_H, -45, M.frame);            // closed entrance door
    P.root.add(P.walls, P.windows);

    P.dyn = new THREE.Group();             // furniture, refreshed each time the view opens
    P.root.add(P.dyn);

    // ---- Downloads. Each one swaps in when it arrives; a failure keeps the stand-in.
    var loader = new THREE.TextureLoader(), aniso = r.capabilities.getMaxAnisotropy();
    M.tile.map.anisotropy = M.wood.map.anisotropy = aniso;
    function begin() { P.total++; showPhotoProgress(); }
    function finish() { P.done++; r.shadowMap.needsUpdate = true; showPhotoProgress(); }
    function texture(name, kind, srgb, apply) {
      begin();
      loader.load(PH + 'Textures/jpg/1k/' + name + '/' + name + '_' + kind + '_1k.jpg', function (t) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        if (srgb) t.encoding = THREE.sRGBEncoding;
        t.anisotropy = aniso;
        apply(t);
        finish();
      }, undefined, finish);
    }
    function textureSet(name, mat, tint) {
      texture(name, 'diff', true, function (t) { mat.map = t; if (tint) mat.color.set(tint); mat.needsUpdate = true; });
      texture(name, 'nor_gl', false, function (t) { mat.normalMap = t; mat.needsUpdate = true; });
      texture(name, 'rough', false, function (t) { mat.roughnessMap = t; mat.roughness = 1; mat.needsUpdate = true; });
    }
    textureSet(PHOTO.wood, M.wood, PHOTO.woodTint);
    // The Bad tiles stay drawn, in the moodboard's warm taupe.

    begin();
    loadScript(PHOTO.rgbeLoader, function (ok) {
      if (!ok || !THREE.RGBELoader) { finish(); return; }
      new THREE.RGBELoader().load(PHOTO.sky, function (t) {
        var pm = new THREE.PMREMGenerator(r);
        P.scene.environment = pm.fromEquirectangular(t).texture;
        pm.dispose();
        t.mapping = THREE.EquirectangularReflectionMapping;
        P.scene.background = t;
        P.hemi.intensity = 0.35;
        finish();
      }, undefined, finish);
    });

    begin();
    loadScript(PHOTO.gltfLoader, function (ok) {
      if (!ok || !THREE.GLTFLoader) { finish(); return; }
      new THREE.GLTFLoader().load(PHOTO.woman, function (g) {
        var model = g.scene;
        P.womanScale = 94.4;     // the model is about 1.8 m tall in metres: scaled to 170 cm in the cm-based scene
        model.traverse(function (o) {
          if (!o.isMesh) return;
          o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
          if (!o.material) return;
          // Grey figure: light grey body, dark grey joints.
          o.material.color.set(/joint/i.test(o.material.name + o.name) ? 0x3b3e43 : 0x9a9ea3);
          o.material.roughness = 0.55; o.material.metalness = 0;
          o.material.envMapIntensity = PHOTO.env;
        });
        // A standing pose instead of the stiff arms-out rest pose.
        var idle = null;
        (g.animations || []).forEach(function (a) { if (a.name === 'idle') idle = a; });
        if (idle) { P.mixer = new THREE.AnimationMixer(model); P.mixer.clipAction(idle).play(); }
        P.womanModel = model;
        syncPhoto();
        finish();
      }, undefined, finish);
    });
  }
  function showPhotoProgress() {
    if (!photoOn) return;
    hintEl.textContent = 'Walkaround: ' + (P.done < P.total
      ? 'loading textures, sky and models (' + P.done + ' of ' + P.total + ') … you can already look around. '
      : '') + WALK_HINT;
  }
  // Plan-mode material -> photoreal material, made once per plan material.
  function pbrFor(m) {
    if (P.pbr[m.uuid]) return P.pbr[m.uuid];
    var out;
    if (m === white || m === basinMat) out = P.mat.ceramic;
    else if (m.metalness > 0.5) out = P.mat.chrome;
    else { out = m.clone(); out.envMapIntensity = PHOTO.env; }    // plan materials are already physically based
    return (P.pbr[m.uuid] = out);
  }
  // Copies the furniture from plan mode, where it stands right now.
  function syncPhoto() {
    while (P.dyn.children.length) P.dyn.remove(P.dyn.children[0]);
    items.forEach(function (it) {
      if (it === woman && P.womanModel) {
        P.womanModel.position.set(it.position.x, 0, it.position.z);
        P.womanModel.rotation.y = it.rotation.y + womanFace;
        P.womanModel.scale.set(P.womanScale, P.womanScale, P.womanScale);
        P.dyn.add(P.womanModel);
        return;
      }
      var copy = it.clone(true);
      copy.visible = true;
      copy.traverse(function (o) {
        if (o.isLine || (o.isMesh && o.material.isMeshBasicMaterial)) { o.visible = false; return; }   // measure lines
        if (o.isMesh) { o.material = pbrFor(o.material); o.castShadow = true; o.receiveShadow = true; }
      });
      P.dyn.add(copy);
    });
    // Painted walls carry over from plan mode.
    applyPaints(P.walls, function (hex) {
      return P.paint[hex] || (P.paint[hex] = new THREE.MeshStandardMaterial({ color: lin(hex), roughness: 0.92, envMapIntensity: PHOTO.env }));
    });
    P.renderer.shadowMap.needsUpdate = true;
  }
  function enterPhoto() {
    if (!P) initPhoto();
    syncPhoto();
    photoLayer.hidden = false;
    showPhotoProgress();
  }
  function leavePhoto() { photoLayer.hidden = true; }

  var vw = 0, vh = 0;
  function resize() {
    vw = stage.clientWidth; vh = stage.clientHeight;
    renderer.setSize(vw, vh, false);
    camera.aspect = vw / Math.max(vh, 1);
    camera.fov = walking ? 75 : (camera.aspect < 1 ? 60 : 45);
    camera.updateProjectionMatrix();
    if (P) {
      P.renderer.setSize(vw, vh, false);
      P.camera.aspect = camera.aspect;
      P.camera.updateProjectionMatrix();
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var v = new THREE.Vector3();
  function frame() {
    if (goal) {
      var k = reduceMotion ? 1 : 0.14;
      var dt = ((goal.theta - cam.theta + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
      cam.theta += dt * k;
      cam.phi += (goal.phi - cam.phi) * k;
      cam.radius += (goal.radius - cam.radius) * k;
      if (Math.abs(dt) < 0.001 && Math.abs(goal.phi - cam.phi) < 0.001) goal = null;
    }
    var now = performance.now(), dtS = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (walking) stepWalk(dtS); else placeCamera();
    if (photoOn) {
      // Only the photoreal scene is drawn; the plan scene rests.
      if (P.mixer) P.mixer.update(dtS);
      P.renderer.render(P.scene, P.camera);
      requestAnimationFrame(frame);
      return;
    }
    if (selBox) selBox.update();
    renderer.render(scene, camera);
    // While the round arrow is being dragged it stays where it was grabbed.
    if (!turning) placeHandle();
    for (var i = 0; !walking && i < labels.length; i++) {
      var L = labels[i];
      v.copy(L.p);
      L.parent.localToWorld(v);
      v.project(camera);
      if (v.z > 1 || v.z < -1) { L.el.style.visibility = 'hidden'; continue; }
      L.el.style.visibility = '';
      L.el.style.transform = 'translate(-50%, -50%) translate(' +
        ((v.x * 0.5 + 0.5) * vw).toFixed(1) + 'px,' + ((-v.y * 0.5 + 0.5) * vh).toFixed(1) + 'px)';
    }
    requestAnimationFrame(frame);
  }
  loadState();
  // Photo texture for the oak planks, loaded in the background once the page is up.
  setTimeout(function () {
    var loader = new THREE.TextureLoader(), aniso = renderer.capabilities.getMaxAnisotropy();
    var base = PH + 'Textures/jpg/1k/' + PHOTO.wood + '/' + PHOTO.wood + '_';
    function get(kind, srgb, apply) {
      loader.load(base + kind + '_1k.jpg', function (t) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        if (srgb) t.encoding = THREE.sRGBEncoding;
        t.anisotropy = aniso;
        apply(t);
        woodMat.needsUpdate = true;
      });
    }
    get('diff', true, function (t) { woodMat.map = t; woodMat.color.setHex(PHOTO.woodTint); });
    get('nor_gl', false, function (t) { woodMat.normalMap = t; });
    get('rough', false, function (t) { woodMat.roughnessMap = t; woodMat.roughness = 1; });
  }, 600);
  frame();
})();
</script>
</body>
</html>
